name: Feature proposal
description: Propose a concrete GuardStep language, runtime, tooling, or integration improvement
title: "[Proposal]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        GuardStep evolves from concrete workflow needs. Major language, IR, runtime, security, or governance changes require an RFC before implementation.

  - type: textarea
    id: problem
    attributes:
      label: Problem and affected users
      description: Describe the workflow problem without assuming a particular implementation.
    validations:
      required: true

  - type: textarea
    id: workflow
    attributes:
      label: Concrete workflow example
      description: Show the smallest real workflow or counterexample that needs this capability.
      render: guardstep
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior
      description: Explain the semantics and failure behavior, not only the syntax.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include existing GuardStep behavior, host-code solutions, or other frameworks where relevant.
    validations:
      required: true

  - type: textarea
    id: safety
    attributes:
      label: Safety, portability, and compatibility effects
      description: Cover capabilities, budgets, approvals, IR compatibility, generated contracts, and provider portability where applicable.
    validations:
      required: true

  - type: dropdown
    id: rfc
    attributes:
      label: Would this require an RFC?
      options:
        - "Yes"
        - "No"
        - "Unsure"
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues and proposals for similar work.
          required: true
        - label: I am proposing this for a concrete workflow need, not only syntax preference.
          required: true
